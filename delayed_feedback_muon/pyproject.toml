[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delayed-feedback-muon"
version = "0.1.0"
description = "Muon-style optimizer with a delayed actual-vs-predicted decrease controller."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["delayed_feedback_muon*"]
